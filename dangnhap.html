<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Đăng nhập</title>
        <link href="css/styles.css" rel="stylesheet">
    </head>
    <body>
        <div class="login">
            <div class="login-box">
                <h2>Đăng nhập</h2>
                <form id="login-form">
                    <label for="email">Email</label>
                    <input id="email" type="email" placeholder="Nhập email của bạn">
                    <div id="email-error" class="error-message"></div>
                    <label for="password">Password</label>
                    <input id="password" type="password" placeholder="Nhập password">
                    <button type="submit">Đăng nhập</button>
                </form>
                <a href="#" class="register forgot-password">Quên mật khẩu?</a>
                <div class="register-row">
                    <p>Bạn chưa có tài khoản?</p>
                    <a class="register" href="dangki.html">Đăng kí ngay</a>
                </div>
                <p class="other-login-text">Hoặc đăng nhập bằng</p>
                <a class="login-btn" href="https://accounts.google.com"><img src="https://upload.wikimedia.org/wikipedia/commons/c/c1/Google_%22G%22_logo.svg" alt="Google Logo" class="logo">Đăng nhập với Google</a>
                <a class="login-btn" href="https://facebook.com"><img src="img/Facebook_Logo.jpg" alt="Facebook Logo" class="logo">Đăng nhập với Facebook</a>
            </div>
        </div>
        <script src="js/dangnhap.js"></script>
    </body>
</html>
